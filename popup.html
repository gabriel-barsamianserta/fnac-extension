<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 240px;
      font-family: Arial, sans-serif;
      padding: 14px;
      margin: 0;
      background-color: #f8f9fa;
      color: #333;
    }
    h3 {
      margin-top: 0;
      margin-bottom: 12px;
      font-size: 16px;
      text-align: center;
    }
    .field {
      margin-bottom: 10px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 4px;
    }
    input[type="number"], input[type="text"] {
      width: 100%;
      padding: 7px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 12px;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      font-size: 11px;
      font-weight: normal;
      cursor: pointer;
    }
    .checkbox-label input {
      margin-right: 6px;
    }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      margin-top: 6px;
    }
    #startBtn {
      background-color: #28a745;
      color: white;
    }
    #stopBtn {
      background-color: #dc3545;
      color: white;
    }
    #status {
      margin-top: 10px;
      font-size: 11px;
      text-align: center;
      font-weight: bold;
      padding: 6px;
      border-radius: 4px;
      background: #fff;
      border: 1px solid #ddd;
    }
  </style>
</head>
<body>
  <h3>Fnac Bot ⚡</h3>
  
  <div class="field">
    <label for="targetQty">Quantité souhaitée :</label>
    <input type="number" id="targetQty" min="1" max="5" value="1">
  </div>

  <div class="field">
    <label class="checkbox-label">
      <input type="checkbox" id="useMaxQty"> Prendre la quantité MAX
    </label>
  </div>

  <div class="field">
    <label for="address">Adresse complète (Point Relais) :</label>
    <input type="text" id="address" placeholder="Ex: 10 rue de la Paix 75002 Paris">
  </div>

  <button id="startBtn">LANCER LE BOT</button>
  <button id="stopBtn">ARRÊTER</button>

  <div id="status">Statut : Inactif</div>

  <script src="popup.js"></script>
</body>
</html>
